<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clocktower Results</title>
  <link rel="icon" href="roles/pukka.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/games">
      <img src="roles/pukka.png" alt="">
      <span>Clocktower Results</span>
    </a>
    <nav>
      <a href="#/games" data-nav="games">Список игр</a>
      <a href="#/new" data-nav="new" class="btn btn-primary">+ Создать игру</a>
      <a href="/api/export" class="btn" download>Экспорт в Excel</a>
    </nav>
  </header>

  <main id="app"></main>

  <div id="role-picker" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="modal-head">
        <h2 id="picker-title">Выберите роль</h2>
        <button type="button" class="icon-btn" data-close aria-label="Закрыть">✕</button>
      </div>
      <div class="modal-body" id="picker-body"></div>
      <div class="modal-foot">
        <button type="button" class="btn" id="picker-clear">Убрать роль</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="roles.js"></script>
  <script src="app.js"></script>
</body>
</html>
